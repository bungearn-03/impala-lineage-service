server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: let react-router handle any path that isn't a real file,
    # so client-side routes (e.g. /connections/123/explorer) survive a
    # hard refresh instead of 404ing on nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        access_log off;
    }
}
